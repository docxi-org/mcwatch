# Виртуальный хост mcwatch. Кладётся в /etc/nginx/sites-available/mcwatch,
# включается ссылкой из sites-enabled. Повторяет схему остальных сайтов
# сервера: Nginx на 80/443 → proxy_pass на локальный порт контейнера.

server {
    # Явный адрес, как у остальных хостов сервера: с `listen 80` виртуальный
    # хост мог бы стать сервером по умолчанию и перехватить чужой трафик.
    listen 80.74.31.205:80;
    server_name mcwatch.docxi.org;

    # Место для ACME-проверки certbot; всё остальное — на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80.74.31.205:443 ssl;
    http2 on;
    server_name mcwatch.docxi.org;

    ssl_certificate     /etc/letsencrypt/live/mcwatch.docxi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcwatch.docxi.org/privkey.pem;

    access_log /var/log/nginx/mcwatch.access.log;
    error_log  /var/log/nginx/mcwatch.error.log;

    # Обложки приходят с чужого домена, но API отдаёт много JSON.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Поток событий мониторинга: буферизация его бы задушила, а таймаут —
    # оборвал. SSE держит соединение открытым часами.
    location /api/events {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
