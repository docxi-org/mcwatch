services:
  app:
    build: .
    image: mcwatch:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_PATH: /app/data/mcwatch.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?нужен ключ OpenRouter, см. .env.example}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-mcwatch@example.com}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_MIN: ${SCHEDULER_INTERVAL_MIN:-60}
    volumes:
      - db:/app/data
    # Наружу порт не выставляется: снаружи только Caddy.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      # Ждём готовности приложения по HEALTHCHECK из Dockerfile: иначе Caddy
      # успевает отдать 502 на первых запросах после `up`.
      app:
        condition: service_healthy
    environment:
      # Без домена Caddy поднимется на localhost с самоподписанным
      # сертификатом — этого достаточно, чтобы проверить compose локально.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  caddy-data:
  caddy-config:
