name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck + lint + тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Сетевых тестов в гейте нет: они в pnpm test:live и запускаются вручную.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
